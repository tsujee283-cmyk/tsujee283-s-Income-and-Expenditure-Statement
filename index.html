<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Forest - 収支管理</title>
  
  <!-- Tailwind CSS (スタイリング用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
    .fade-in { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#F0EBE1] text-[#3D352B] selection:bg-[#7D9179] selection:text-white pb-20 relative overflow-x-hidden min-h-screen">

  <!-- 背景の近未来的な装飾 -->
  <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-[#E1D7C6] rounded-full mix-blend-multiply filter blur-[100px] opacity-70 z-0 animate-pulse" style="animation-duration: 8s"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-[#D4E0D1] rounded-full mix-blend-multiply filter blur-[120px] opacity-60 z-0 animate-pulse" style="animation-duration: 10s"></div>

  <!-- アプリケーション全体コンテナ -->
  <div id="app" class="relative z-10 w-full min-h-screen flex items-center justify-center">
    <div class="text-[#8C7A6B] animate-pulse">読み込み中...</div>
  </div>

  <!-- Firebase (ES Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, 
      createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 【設定】ご自身のFirebaseプロジェクトの設定をここに記入してください ---
    const dummyConfig = {0420
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : dummyConfig;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'vintage-manager-local';
    
    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch(e) {
      console.error("Firebase初期化エラー:", e);
    }

    // --- アプリケーション状態管理 (Vanilla JS State) ---
    let state = {
      user: null,
      authLoading: true,
      isLoginMode: true,
      authError: '',
      items: [],
      purchasingBudget: 40000,
      randomSeed: Math.random()
    };

    let unsubItems = null;
    let unsubBudget = null;

    // --- 商品カテゴリ自動分類 ---
    function categorizeItem(name) {
      const lower = name.toLowerCase();
      if (lower.includes('tシャツ') || lower.includes('ロンt')) return 'Tシャツ';
      if (lower.includes('シャツ') || lower.includes('ブラウス')) return 'シャツ';
      if (lower.includes('ジャケット') || lower.includes('コート') || lower.includes('アウター')) return 'アウター';
      if (lower.includes('パンツ') || lower.includes('スラックス') || lower.includes('ショーツ')) return 'パンツ';
      if (lower.includes('デニム') || lower.includes('ジーンズ')) return 'デニム';
      if (lower.includes('ニット') || lower.includes('セーター') || lower.includes('カーディガン')) return 'ニット';
      if (lower.includes('スウェット') || lower.includes('パーカー') || lower.includes('フーディ')) return 'スウェット';
      if (lower.includes('スカート') || lower.includes('ワンピース')) return 'スカート/ワンピ';
      if (lower.includes('靴') || lower.includes('スニーカー') || lower.includes('ブーツ')) return 'シューズ';
      if (lower.includes('バッグ') || lower.includes('帽子') || lower.includes('キャップ')) return '小物';
      return 'その他';
    }

    // --- 認証状態の監視 ---
    onAuthStateChanged(auth, (u) => {
      state.user = u;
      state.authLoading = false;
      
      if (unsubItems) { unsubItems(); unsubItems = null; }
      if (unsubBudget) { unsubBudget(); unsubBudget = null; }

      if (u && !u.isAnonymous) {
        // Firestoreから商品データを購読
        const itemsRef = collection(db, 'artifacts', appId, 'users', u.uid, 'items');
        unsubItems = onSnapshot(itemsRef, (snapshot) => {
          const list = [];
          snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
          state.items = list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          render();
        });

        // Firestoreから仕入れ予算設定を購読
        const budgetRef = doc(db, 'artifacts', appId, 'users', u.uid, 'settings', 'budget');
        unsubBudget = onSnapshot(budgetRef, (d) => {
          if (d.exists() && d.data().amount) {
            state.purchasingBudget = d.data().amount;
            render();
          }
        });
      } else {
        state.items = [];
        render();
      }
    });

    // --- メインレンダリング関数 ---
    function render() {
      const root = document.getElementById('app');
      
      if (state.authLoading) {
        root.innerHTML = `<div class="text-[#8C7A6B] animate-pulse">読み込み中...</div>`;
        return;
      }

      // ログイン画面
      if (!state.user || state.user.isAnonymous) {
        root.innerHTML = `
          <div class="w-full max-w-md p-4 mx-auto">
            <div class="bg-white/40 backdrop-blur-xl border border-white/60 p-8 rounded-3xl shadow-[0_8px_32px_0_rgba(107,96,84,0.1)] fade-in">
              <div class="text-center mb-8">
                <svg class="w-12 h-12 text-[#5C715E] mx-auto mb-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                <h1 class="text-2xl font-bold text-[#2C2621]">Vintage Forest</h1>
                <p class="text-[#6B6054] text-sm mt-2">収支と在庫をクラウドで美しく管理</p>
              </div>

              <form id="auth-form" class="space-y-5">
                ${state.authError ? `<div class="bg-[#A85C5C]/10 border border-[#A85C5C]/30 text-[#A85C5C] text-xs p-3 rounded-xl text-center">${state.authError}</div>` : ''}
                <div>
                  <label class="block text-xs font-medium text-[#6B6054] mb-1">メールアドレス</label>
                  <input type="email" id="auth-email" required class="w-full bg-white/60 border border-white/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#7D9179]/50 text-[#2C2621]" placeholder="mail@example.com">
                </div>
                <div>
                  <label class="block text-xs font-medium text-[#6B6054] mb-1">パスワード</label>
                  <input type="password" id="auth-password" required class="w-full bg-white/60 border border-white/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#7D9179]/50 text-[#2C2621]" placeholder="6文字以上">
                </div>
                <button type="submit" class="w-full bg-[#5C715E] hover:bg-[#4A5B4B] text-white rounded-xl py-3 text-sm font-medium transition-colors shadow-md shadow-[#5C715E]/20">
                  ${state.isLoginMode ? 'ログイン' : 'アカウントを新規作成'}
                </button>
              </form>

              <div class="mt-6 text-center">
                <button id="toggle-mode-btn" class="text-xs text-[#8C7A6B] hover:text-[#5C715E] underline transition-colors">
                  ${state.isLoginMode ? '初めての方はこちら（新規登録）' : 'すでにアカウントをお持ちの方（ログイン）'}
                </button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('auth-form').onsubmit = async (e) => {
          e.preventDefault();
          const email = document.getElementById('auth-email').value;
          const password = document.getElementById('auth-password').value;
          state.authError = '';
          try {
            if (state.isLoginMode) {
              await signInWithEmailAndPassword(auth, email, password);
            } else {
              await createUserWithEmailAndPassword(auth, email, password);
            }
          } catch (err) {
            if (err.code === 'auth/email-already-in-use') state.authError = 'このメールアドレスは既に登録されています。';
            else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') state.authError = 'メールアドレスまたはパスワードが間違っています。';
            else if (err.code === 'auth/user-not-found') state.authError = 'ユーザーが見つかりません。';
            else if (err.code === 'auth/weak-password') state.authError = 'パスワードは6文字以上で設定してください。';
            else state.authError = 'エラーが発生しました。入力内容を確認してください。';
            render();
          }
        };

        document.getElementById('toggle-mode-btn').onclick = () => {
          state.isLoginMode = !state.isLoginMode;
          state.authError = '';
          render();
        };
        return;
      }

      // --- 計算ロジック ---
      let netSales = 0, mercariFeeTotal = 0;
      state.items.forEach(item => {
        if (item.isSold) {
          const price = Number(item.listingPrice);
          const fee = Math.floor(price * 0.1);
          const shipping = Number(item.salesShipping) || 0;
          mercariFeeTotal += fee;
          netSales += (price - fee - shipping);
        }
      });

      const repayment = 20000;
      const availableAfterFixed = netSales - repayment - state.purchasingBudget;
      const reserveRatio = 0.1 + (state.randomSeed * 0.2);
      const reserveFund = availableAfterFixed > 0 ? Math.floor(availableAfterFixed * reserveRatio) : 0;
      const freeFund = availableAfterFixed > 0 ? availableAfterFixed - reserveFund : availableAfterFixed;

      // カテゴリ別集計
      const counts = {};
      state.items.forEach(item => {
        const cat = categorizeItem(item.name);
        if (!counts[cat]) counts[cat] = { category: cat, active: 0, sold: 0 };
        if (item.isSold) counts[cat].sold += 1;
        else counts[cat].active += 1;
      });
      const chartList = Object.values(counts).sort((a, b) => (b.active + b.sold) - (a.active + a.sold));

      const activeItems = state.items.filter(i => !i.isSold);
      const soldItems = state.items.filter(i => i.isSold);

      // ダッシュボード画面
      root.innerHTML = `
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-12 pb-20 w-full fade-in">
          <!-- ヘッダー -->
          <header class="mb-10 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
              <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-[#2C2621] flex items-center justify-center sm:justify-start gap-3">
                <svg class="w-8 h-8 text-[#5C715E]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                Vintage Forest
              </h1>
              <p class="mt-1 text-xs text-[#6B6054] bg-[#E1D7C6]/50 inline-block px-3 py-1 rounded-full">${state.user.email} でログイン中</p>
            </div>
            <button id="logout-btn" class="flex items-center gap-2 text-xs text-[#8C7A6B] hover:text-[#A85C5C] bg-white/40 px-4 py-2 rounded-full border border-white/60 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> ログアウト
            </button>
          </header>

          <!-- 資金シミュレーション -->
          <div class="bg-white/40 backdrop-blur-xl border border-white/60 rounded-3xl p-6 sm:p-8 mb-12 shadow-[0_8px_32px_0_rgba(107,96,84,0.1)]">
            <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
              <svg class="w-6 h-6 text-[#8C7A6B]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9.5V21m0-11.5L6 3m6 6.5L18 3M6 15h12M6 11h12"/></svg>
              売上と資金分配シミュレーション
            </h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div class="bg-white/50 rounded-2xl p-4 border border-white/50">
                <p class="text-sm text-[#6B6054] mb-1">売上金合計 (手数料・送料引後)</p>
                <p class="text-2xl font-bold text-[#2C2621]">¥${netSales.toLocaleString()}</p>
                <p class="text-xs text-[#8C7A6B] mt-2">※メルカリ手数料: ¥${mercariFeeTotal.toLocaleString()}</p>
              </div>
              
              <div class="bg-white/50 rounded-2xl p-4 border border-white/50 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-[#A85C5C]"></div>
                <p class="text-sm text-[#6B6054] mb-1">月々返済額 (固定)</p>
                <p class="text-2xl font-bold text-[#A85C5C]">-¥${repayment.toLocaleString()}</p>
              </div>
              
              <div class="bg-white/50 rounded-2xl p-4 border border-white/50 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-[#D4A373]"></div>
                <p class="text-sm text-[#6B6054] mb-1">仕入れ費用 (自動保存)</p>
                <p class="text-2xl font-bold text-[#D4A373]" id="budget-display">-¥${state.purchasingBudget.toLocaleString()}</p>
                <input type="range" min="30000" max="50000" step="1000" value="${state.purchasingBudget}" id="budget-slider" class="w-full mt-3 accent-[#D4A373] h-1 bg-[#E1D7C6] rounded-lg appearance-none cursor-pointer">
              </div>

              <div class="bg-white/50 rounded-2xl p-4 border border-white/50 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-[#5C715E]"></div>
                <p class="text-sm text-[#6B6054] mb-1">経営資金 (自動ランダム)</p>
                <p class="text-2xl font-bold text-[#5C715E]">-¥${reserveFund.toLocaleString()}</p>
              </div>
            </div>

            <div class="p-6 rounded-2xl border transition-all duration-500 ${freeFund > 0 ? 'bg-gradient-to-r from-[#5C715E]/10 to-[#7D9179]/10 border-[#7D9179]/30' : 'bg-white/40 border-white/50'}">
              <h3 class="text-lg text-[#6B6054] text-center mb-2">手元に残る自由資金</h3>
              <p class="text-4xl sm:text-5xl font-bold text-center tracking-tight ${freeFund > 0 ? 'text-[#3E4C40]' : 'text-[#A85C5C]'}">
                ${freeFund > 0 ? '+' : ''}¥${freeFund.toLocaleString()}
              </p>
              ${freeFund < 0 ? `<p class="text-center text-sm text-[#A85C5C] mt-3">利益が出るまであと ¥${Math.abs(freeFund).toLocaleString()} です！</p>` : ''}
            </div>
          </div>

          <!-- メイングリッド -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左カラム -->
            <div class="lg:col-span-1 space-y-8">
              <div class="bg-white/40 backdrop-blur-xl border border-white/60 rounded-3xl p-6 shadow-sm">
                <h2 class="text-lg font-semibold mb-5 flex items-center gap-2">
                  <svg class="w-5 h-5 text-[#8C7A6B]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m3.3 7 8.7 5 8.7-5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 22V12"/></svg>
                  新しい商品を登録
                </h2>
                <form id="add-item-form" class="space-y-4">
                  <div>
                    <label class="block text-xs font-medium text-[#6B6054] mb-1">商品名 (特徴を含める)</label>
                    <input type="text" id="item-name" required placeholder="例: 90s NIKE スウェット" class="w-full bg-white/60 border border-white/80 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#7D9179]/50 text-[#2C2621]">
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-[#6B6054] mb-1">仕入れ値 (¥)</label>
                      <input type="number" id="item-p-price" required placeholder="1500" class="w-full bg-white/60 border border-white/80 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#7D9179]/50 text-[#2C2621]">
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-[#6B6054] mb-1">仕入れ送料 (¥)</label>
                      <input type="number" id="item-p-ship" placeholder="210" class="w-full bg-white/60 border border-white/80 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#7D9179]/50 text-[#2C2621]">
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-[#6B6054] mb-1">出品予定価格 (¥)</label>
                    <input type="number" id="item-l-price" required placeholder="5500" class="w-full bg-white/60 border border-white/80 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#7D9179]/50 text-[#2C2621]">
                  </div>
                  <button type="submit" class="w-full bg-[#5C715E] hover:bg-[#4A5B4B] text-white rounded-xl py-3 text-sm font-medium transition-colors shadow-md shadow-[#5C715E]/20">
                    登録する
                  </button>
                </form>
              </div>

              <!-- カテゴリ別市場動向 -->
              <div class="bg-white/40 backdrop-blur-xl border border-white/60 rounded-3xl p-6 shadow-sm">
                <h2 class="text-lg font-semibold mb-5 text-[#2C2621]">カテゴリ別 市場動向</h2>
                <div class="space-y-4">
                  ${chartList.length === 0 ? `<p class="text-sm text-[#8C7A6B] text-center py-4">データがありません</p>` : chartList.map(data => {
                    const total = data.active + data.sold;
                    const soldPercent = (data.sold / total) * 100;
                    const activePercent = (data.active / total) * 100;
                    return `
                      <div>
                        <div class="flex justify-between text-xs mb-1">
                          <span class="font-medium text-[#4a3f35]">${data.category}</span>
                          <span class="text-[#8C7A6B]">計 ${total}着 (売却 ${data.sold})</span>
                        </div>
                        <div class="h-3 w-full bg-[#E1D7C6] rounded-full overflow-hidden flex">
                          <div class="h-full bg-[#5C715E] transition-all duration-1000" style="width: ${soldPercent}%"></div>
                          <div class="h-full bg-[#D4A373] transition-all duration-1000" style="width: ${activePercent}%"></div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                  <div class="flex justify-center gap-4 mt-4 text-[10px] text-[#6B6054]">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#5C715E]"></span>売却済</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#D4A373]"></span>出品中(売れ残り)</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 右カラム -->
            <div class="lg:col-span-2 space-y-8">
              <!-- 出品中リスト -->
              <div>
                <h2 class="text-xl font-bold mb-4 text-[#2C2621] flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-[#D4A373]"></span>出品中（売れ残り一覧）
                  <span class="text-sm font-normal text-[#8C7A6B] ml-2">${activeItems.length}件</span>
                </h2>
                ${activeItems.length === 0 ? `
                  <div class="bg-white/40 border border-white/60 rounded-2xl p-8 text-center text-[#8C7A6B]">現在出品中のアイテムはありません。</div>
                ` : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${activeItems.map(item => `
                      <div class="bg-white/60 backdrop-blur-md border border-white/80 rounded-2xl p-4 shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                          <h3 class="font-medium text-[#2C2621] text-sm leading-tight line-clamp-2 pr-2">${item.name}</h3>
                          <div class="flex items-center shrink-0">
                            <span class="text-[10px] bg-[#E1D7C6] text-[#6B6054] px-2 py-1 rounded-full whitespace-nowrap">${categorizeItem(item.name)}</span>
                            <button onclick="deleteItem('${item.id}')" class="ml-2 text-[#A85C5C]/60 hover:text-[#A85C5C] transition-colors p-1 rounded-full hover:bg-white/50" title="削除">
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            </button>
                          </div>
                        </div>
                        <div class="text-xs text-[#8C7A6B] mb-4 space-y-1">
                          <p>仕入れ: ¥${item.purchasePrice} (+送料¥${item.purchaseShipping})</p>
                          <p class="font-semibold text-[#D4A373]">出品価格: ¥${item.listingPrice}</p>
                        </div>
                        <button onclick="toggleSold('${item.id}', ${item.isSold}, ${item.salesShipping})" class="w-full border-2 border-[#5C715E] text-[#5C715E] hover:bg-[#5C715E] hover:text-white rounded-xl py-2 text-sm font-medium transition-colors">
                          売れた！チェックをつける
                        </button>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>

              <!-- 売却済みリスト -->
              <div>
                <h2 class="text-xl font-bold mb-4 text-[#2C2621] flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-[#5C715E]"></span>売却済みアイテム
                  <span class="text-sm font-normal text-[#8C7A6B] ml-2">${soldItems.length}件</span>
                </h2>
                ${soldItems.length === 0 ? `
                  <div class="bg-white/40 border border-white/60 rounded-2xl p-8 text-center text-[#8C7A6B]">まだ売れたアイテムはありません。</div>
                ` : `
                  <div class="space-y-3">
                    ${soldItems.map(item => `
                      <div class="bg-white/40 backdrop-blur-sm border border-[#5C715E]/20 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex-1">
                          <h3 class="font-medium text-[#2C2621] text-sm line-through opacity-70">${item.name}</h3>
                          <div class="flex items-center gap-3 mt-1 text-xs text-[#6B6054]">
                            <span>販売額: ¥${item.listingPrice}</span>
                            <span class="text-[#A85C5C]">-手数料: ¥${Math.floor(item.listingPrice * 0.1)}</span>
                          </div>
                        </div>
                        <div class="flex items-center justify-end gap-3 w-full sm:w-auto">
                          <div class="flex items-center gap-2 bg-white/60 border border-white/80 rounded-xl px-3 py-1.5">
                            <label class="text-[10px] text-[#8C7A6B] whitespace-nowrap">売却送料</label>
                            <input type="number" id="ship-${item.id}" value="${item.salesShipping}" onblur="updateShipping('${item.id}', this.value)" class="w-16 bg-transparent text-sm focus:outline-none font-medium text-[#2C2621] text-right pr-1">
                            <span class="text-xs text-[#8C7A6B]">円</span>
                          </div>
                          <button onclick="toggleSold('${item.id}', ${item.isSold}, ${item.salesShipping})" class="text-xs text-[#8C7A6B] hover:text-[#2C2621] underline whitespace-nowrap">元に戻す</button>
                          <button onclick="deleteItem('${item.id}')" class="text-[#A85C5C]/60 hover:text-[#A85C5C] transition-colors p-1 rounded-full hover:bg-white/50" title="削除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                          </button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;

      // --- イベントリスナーの登録 ---
      document.getElementById('logout-btn').onclick = async () => {
        await signOut(auth);
      };

      const slider = document.getElementById('budget-slider');
      const budgetDisplay = document.getElementById('budget-display');
      slider.oninput = (e) => {
        budgetDisplay.innerText = `-¥${Number(e.target.value).toLocaleString()}`;
      };
      slider.onmouseup = async (e) => {
        const val = Number(e.target.value);
        state.purchasingBudget = val;
        const budgetRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'settings', 'budget');
        await setDoc(budgetRef, { amount: val }, { merge: true });
      };
      slider.ontouchend = async (e) => {
        const val = Number(e.target.value);
        state.purchasingBudget = val;
        const budgetRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'settings', 'budget');
        await setDoc(budgetRef, { amount: val }, { merge: true });
      };

      document.getElementById('add-item-form').onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('item-name').value;
        const pPrice = document.getElementById('item-p-price').value;
        const pShip = document.getElementById('item-p-ship').value || 0;
        const lPrice = document.getElementById('item-l-price').value;

        const itemsRef = collection(db, 'artifacts', appId, 'users', state.user.uid, 'items');
        await addDoc(itemsRef, {
          name,
          purchasePrice: Number(pPrice),
          purchaseShipping: Number(pShip),
          listingPrice: Number(lPrice),
          isSold: false,
          salesShipping: 0,
          createdAt: Date.now()
        });
      };
    }

    // --- グローバルアクション関数 ---
    window.toggleSold = async (id, currentStatus, currentShip) => {
      state.randomSeed = Math.random();
      const itemRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id);
      await updateDoc(itemRef, {
        isSold: !currentStatus,
        salesShipping: !currentStatus ? currentShip || 750 : 0
      });
    };

    window.updateShipping = async (id, val) => {
      const itemRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id);
      await updateDoc(itemRef, { salesShipping: Number(val) });
    };

    window.deleteItem = async (id) => {
      const itemRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'items', id);
      await deleteDoc(itemRef);
    };
  </script>
</body>
</html>
